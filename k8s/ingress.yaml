apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
spec:
  rules:
  - host: myapp.local
    http:
      paths:
      - path: /api/sensors
        pathType: Prefix
        backend:
          service:
            name: sensor-service
            port:
              number: 8081
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: user-service
            port:
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80