$kind: http-request
name: Create Setting
method: POST
url: 'http://localhost:8080/api/users/settings'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "type": "Traffic",
      "metric": "trafficDensity",
      "thresholdValue": 80.0,
      "alertType": "above"
    }
