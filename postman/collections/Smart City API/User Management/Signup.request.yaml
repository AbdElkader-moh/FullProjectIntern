$kind: http-request
name: Signup
method: POST
url: 'http://localhost:8080/api/users/signup'
order: 1000
body:
  type: formdata
  content:
    - key: email
      type: text
      value: 'user@example.com'
    - key: firstName
      type: text
      value: John
    - key: lastName
      type: text
      value: Doe
    - key: password
      type: text
      value: abc123
    - key: profilePicture
      type: file
      src: ''
