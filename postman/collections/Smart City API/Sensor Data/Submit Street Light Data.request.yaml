$kind: http-request
name: Submit Street Light Data
method: POST
url: 'http://localhost:8081/api/sensors/light'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "location": "Park Avenue",
      "brightnessLevel": 80,
      "powerConsumption": 150.5,
      "status": "ON"
    }
