    value: application/json
body:
  type: json
  content: |-
    {
      "location": "City Center",
      "pm2_5": 12.5,
      "pm10": 25.0,
      "co": 0.5,
      "no2": 30.0,
      "so2": 10.0,
      "ozone": 50.0,
      "pollutionLevel": "Good"
    }
