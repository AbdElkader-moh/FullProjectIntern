# Picked up by the shared Pipelines-as-Code controller on every push GitHub
# forwards via the webhook configured on this repo (see
# tekton/10-pac-repository.yaml). Restricted to main via on-target-branch --
# same reasoning as the CEL filter in the abandoned EventListener attempt:
# run-selenium succeeding always leads straight to deploy-prod
# (tekton/02-pipeline.yaml has no branch check of its own), so this must not
# fire for feature branches.
#
# max-keep-runs caps how many finished PipelineRuns PAC leaves behind for
# this file -- without it, every push adds another set of pods that never
# get cleaned up, which is exactly what exhausted the namespace's 50-pod
# quota before (see tekton/04-deploy-task.yaml's history).
#
# PAC doesn't resolve pipelineRef/taskRef against objects already sitting in
# the cluster -- it only knows Pipelines/Tasks it can fetch and inline itself
# at resolve time, so every Task the Pipeline references (not just the
# Pipeline itself) needs to be reachable through these annotations too:
#   - "git-clone" is a bare Tekton Hub name (no local file -- it was applied
#     straight from the catalog originally), which PAC resolves against the
#     Hub instead of a URL.
#   - the rest are raw-file URLs into this repo's own tekton/ task
#     definitions, fetched with the same provider.token as the pipeline
#     annotation above (private repo).
# PAC matches each fetched file back to the taskRef.name used inside
# tekton/02-pipeline.yaml by the fetched file's own metadata.name.
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: build-project-run-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/pipeline: "https://raw.githubusercontent.com/AbdElkader-moh/FullProjectIntern/main/tekton/02-pipeline.yaml"
    pipelinesascode.tekton.dev/task: "[git-clone, https://raw.githubusercontent.com/AbdElkader-moh/FullProjectIntern/main/tekton/03-buildah-task.yaml, https://raw.githubusercontent.com/AbdElkader-moh/FullProjectIntern/main/tekton/04-deploy-task.yaml, https://raw.githubusercontent.com/AbdElkader-moh/FullProjectIntern/main/tekton/05-newman-task.yaml, https://raw.githubusercontent.com/AbdElkader-moh/FullProjectIntern/main/tekton/06-selenium-task.yaml, https://raw.githubusercontent.com/AbdElkader-moh/FullProjectIntern/main/tekton/08-cleanup-task.yaml]"
spec:
  pipelineRef:
    name: build-project
  params:
    - name: repo-url
      value: "{{ repo_url }}"
  workspaces:
    - name: shared-workspace
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
