# Only send "Connection: upgrade" on requests that actually asked to
# upgrade. A hardcoded "upgrade" was being sent on every request through
# location /ws -- including SockJS's plain HTTP fallback transports
# (xhr_streaming, xhr, jsonp), which don't send an Upgrade header at all.
# That's what was breaking both the raw WebSocket handshake (200 instead
# of 101) and the HTTP fallbacks (405) for the shared-alerts toast feature.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # User service proxy (auth, profile, settings, notifications)
    location /api/users/ {
        proxy_pass http://user-service:8080/api/users/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Sensor service proxy (traffic, air quality, street light data)
    location /api/sensors/ {
        proxy_pass http://sensor-service:8081/api/sensors/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    # Sensor service WebSocket proxy
    location /ws {
        proxy_pass http://sensor-service:8081/ws;
        proxy_http_version 1.1;
    
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Swagger UI (user service)
    location /swagger-ui/ {
        proxy_pass http://user-service:8080/swagger-ui/;
        proxy_set_header Host $host;
    }

    location /v3/api-docs {
        proxy_pass http://user-service:8080/v3/api-docs;
        proxy_set_header Host $host;
    }

    location /swagger-ui.html {
        proxy_pass http://user-service:8080/swagger-ui.html;
        proxy_set_header Host $host;
    }
}
