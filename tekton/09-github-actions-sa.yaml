# Identity the GitHub Actions workflow (.github/workflows/trigger-pipeline.yml)
# authenticates as to start a PipelineRun on push. Scoped to just "create
# pipelineruns" -- it doesn't need to read/list anything else, and
# specifically doesn't need the cluster-scoped ClusterInterceptor access that
# blocked the EventListener approach (see tekton/README or prior commit
# notes): this SA never touches Tekton Triggers at all, so the Developer
# Sandbox's cluster-scope RBAC restriction doesn't apply to it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions-trigger

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-trigger-role
rules:
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["create", "get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-trigger-rolebinding
subjects:
  - kind: ServiceAccount
    name: github-actions-trigger
roleRef:
  kind: Role
  name: github-actions-trigger-role
  apiGroup: rbac.authorization.k8s.io
