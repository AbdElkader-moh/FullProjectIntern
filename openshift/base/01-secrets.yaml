# TEMPLATE ONLY -- no real credentials.
#
# Replace every CHANGE_ME value before applying, or better, don't apply this
# file at all and create the secrets imperatively instead, e.g.:
#   oc create secret generic mysql-secret \
#     --from-literal=mysql_root_password='...' \
#     --from-literal=mysql_user='...' \
#     --from-literal=mysql_password='...'
#
# jwt-secret is REQUIRED: JwtUtil (in both user-service and sensor-service)
# reads JWT_SECRET_FILE at startup and throws a NullPointerException if it
# resolves to nothing, so the pods will crash-loop without it.
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  labels:
    app: mysql
type: Opaque
stringData:
  mysql_root_password: "root123"
  mysql_user: "appuser"
  mysql_password: "app123"
---
