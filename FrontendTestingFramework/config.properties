# ============================================================
# Infrastructure Configuration
# ============================================================
# Override any value with environment variable or -D system property.
#
# IMPORTANT: Test credentials and test input data have been moved to
#            src/test/resources/test_data.xlsx (ExcelDataReader).
#            Do NOT add app.email / app.password back here.
# ============================================================

app.url=http://localhost:4200
app.base.url=http://localhost:4200

# ?? Excel test data path ?????????????????????????????????????
test.data.excel.path=src/test/resources/test_data.xlsx

# ?? Browser ??????????????????????????????????????????????????
browser=chrome
headless=false

# ?? Timeouts (seconds) ???????????????????????????????????????
implicit.wait=0
explicit.wait=10
page.load.timeout=30

# ?? Notification-specific timeouts ???????????????????????????
notification.bell.timeout=40
notification.appearance.timeout=70
notification.read.state.timeout=40
mark.all.read.timeout=20

# ?? Simulator / backend sync ?????????????????????????????????
simulator.delay.timeout=9180
simulator.poll.interval.ms=5000

# ?? Retry mechanism ???????????????????????????????????????????
retry.attempts=5
retry.interval.ms=2000

# ?? Polling cadence for FluentWait (ms) ??????????????????????
polling.interval.ms=1000

# ?? Reporting ????????????????????????????????????????????????
reports.dir=reports
screenshots.dir=reports/screenshots
extent.report.name=TestExecutionReport
allure.results.directory=target/allure-results

# ?? Test assets ??????????????????????????????????????????????
signup.image.path=src/test/resources/test-image.png