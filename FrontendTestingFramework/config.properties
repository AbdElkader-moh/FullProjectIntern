# ============================================================
# Infrastructure Configuration
# ============================================================
# Credentials ? src/test/resources/test_data.xlsx (not here)
# ============================================================

# ?? URLs ??????????????????????????????????????????????????????
# Angular frontend (docker-compose: ports 4200:80 ? nginx inside container)
app.url=http://localhost:4200
app.base.url=http://localhost:4200

# Sensor service (docker-compose: ports 8081:8081 ? host-side 8081)
# Used by SensorApiClient to seed test data directly.
# NOTE: do NOT use http://sensor-service:8081 ? that hostname is only
# reachable from inside the Docker bridge network (project-net).
# The test machine is outside Docker, so it must use localhost + host port.
app.sensor.url=http://localhost:8081

# User service runs on 8088:8080 in docker-compose ? not needed by tests
# because auth is handled via Selenium (browser login), not direct API calls.

# ?? Excel test data ???????????????????????????????????????????
test.data.excel.path=src/test/resources/test_data.xlsx

# ?? Browser ???????????????????????????????????????????????????
browser=chrome
headless=false

# ?? Timeouts (seconds) ????????????????????????????????????????
implicit.wait=0
explicit.wait=30
page.load.timeout=30

# ?? Notification timeouts ?????????????????????????????????????
notification.bell.timeout=20
notification.appearance.timeout=60
notification.read.state.timeout=30
mark.all.read.timeout=10

# ?? Simulator / backend sync ??????????????????????????????????
# Kept for NotificationsTest which still polls for simulator events.
# Traffic tests use SensorApiClient directly ? no polling needed there.
simulator.delay.timeout=90
simulator.poll.interval.ms=3000
signup.redirect.timeout=30

# ?? Retry ????????????????????????????????????????????????????
retry.attempts=3
retry.interval.ms=1000
polling.interval.ms=500

# ?? Reporting ?????????????????????????????????????????????????
reports.dir=reports
screenshots.dir=reports/screenshots
extent.report.name=TestExecutionReport
allure.results.directory=target/allure-results

# ?? Test assets ???????????????????????????????????????????????
signup.image.path=src/test/resources/test-image.png