# ============================================================
# Application Configuration
# ============================================================
# Override any value with environment variable or -D system property

app.url=http://localhost:4200
app.base.url=http://localhost:4200

# ============================================================
# Test Credentials (NEVER commit real credentials)
# Use env vars: APP_EMAIL, APP_PASSWORD in CI/CD
# ============================================================
app.email=nadiinahmed25@gmail.com
app.password=123456

# ============================================================
# Browser Configuration
# ============================================================
browser=chrome
headless=false

# ============================================================
# Timeouts (seconds)
# ============================================================
implicit.wait=0
explicit.wait=10
page.load.timeout=30

# ── Notification-specific Timeouts ──────────────────────────
notification.bell.timeout=20
notification.appearance.timeout=60
notification.read.state.timeout=15
mark.all.read.timeout=10

# ── Simulator / Backend Sync ─────────────────────────────────
simulator.delay.timeout=90
simulator.poll.interval.ms=3000

# ── Retry Mechanism ──────────────────────────────────────────
retry.attempts=3
retry.interval.ms=1000

# ── Polling cadence for FluentWait (ms) ──────────────────────
polling.interval.ms=500

# ============================================================
# Reporting
# ============================================================
reports.dir=reports
screenshots.dir=reports/screenshots
extent.report.name=TestExecutionReport

# ============================================================
# Test Data
# ============================================================
signup.first.name=TestUser
signup.last.name=Automation
signup.duplicate.email=nadiinahmed25@gmail.com
signup.image.path=src/test/resources/test-image.png
